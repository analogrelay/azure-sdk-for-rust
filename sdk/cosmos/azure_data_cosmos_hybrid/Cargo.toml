[package]
name = "azure_data_cosmos_hybrid"
version = "0.1.0"
description = "Prototype hybrid transactional and analytical query SDK for Azure Cosmos DB"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["azure-openai", "mssql-rs"]
# Enables the built-in Azure OpenAI embedding and reranking adapters.
azure-openai = []
# Enables the built-in Fabric TDS adapter based on Microsoft's mssql-rs project.
mssql-rs = []

[lints]
workspace = true
